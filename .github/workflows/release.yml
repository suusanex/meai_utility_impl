name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore MultiCodingAgentFacade.sln

      - name: Build (Release)
        run: dotnet build MultiCodingAgentFacade.sln -c Release --no-restore

      - name: Collect artifacts
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          LIBRARY_PROJECTS=(
            "src/MultiCodingAgentFacade.Core"
            "src/MultiCodingAgentFacade.GitHubCopilot"
            "src/MultiCodingAgentFacade.CodexAppServer"
          )
          for TFM in net8.0 net10.0; do
            mkdir -p "dist/${TFM}"
            for PROJECT in "${LIBRARY_PROJECTS[@]}"; do
              cp "${PROJECT}/bin/Release/${TFM}"/MultiCodingAgentFacade.*.dll "dist/${TFM}/"
            done
            (cd dist && zip -r "MultiCodingAgentFacade-${TAG}-${TFM}.zip" "${TFM}/")
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/MultiCodingAgentFacade-*.zip
