name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tfm: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore MultiCodingAgentFacade.sln
      - name: Build
        run: dotnet build MultiCodingAgentFacade.sln -f ${{ matrix.tfm }} --no-restore
      - name: Test
        run: dotnet test MultiCodingAgentFacade.sln -f ${{ matrix.tfm }} --no-build
      - name: Old-name audit
        shell: pwsh
        run: ./tools/Invoke-OldNameAudit.ps1
